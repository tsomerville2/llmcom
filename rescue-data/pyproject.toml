[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "llmcom-rescue-data"
version = "0.2.0"
description = "Automatically installed offline rescue payload companion for llmcom."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Travis Somerville"}]

[project.urls]
Repository = "https://github.com/tsomerville2/llmcom"

[tool.hatch.build.targets.wheel]
packages = ["src/llmcom_rescue_data"]

[tool.hatch.build.targets.sdist]
include = ["src/llmcom_rescue_data/**", "README.md", "LICENSE", "pyproject.toml"]
