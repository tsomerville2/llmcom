name: Package checks
on:
  push:
    branches: [main]
  pull_request:
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Offline onboarding regression checks
        run: /usr/bin/python3 -m unittest discover -p test_onboarding.py -v
      - name: Build wheel from source distribution
        run: uv build
      - name: Validate package metadata
        run: uvx twine check dist/*
      - name: Install and inspect published interface
        run: |
          uv tool run --from dist/llmcom-*.whl llmcom --version
          uv tool run --from dist/llmcom-*.whl llmcom --help
          uv tool run --from dist/llmcom-*.whl llmcom --skill
      - uses: actions/upload-artifact@v4
        with:
          name: python-distributions
          path: dist/*
